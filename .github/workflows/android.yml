name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build APKs
        id: build_apks
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest
      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest
      - name: Summarize unit test failures
        if: always()
        shell: python
        run: |
          import glob, os, xml.etree.ElementTree as ET
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## JVM test results\n")
              reports = glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml")
              if not reports:
                  summary.write("No JUnit XML reports were produced; inspect the Unit tests step log.\n")
              for path in reports:
                  root = ET.parse(path).getroot()
                  summary.write(f"- {root.get('name')}: tests={root.get('tests')}, failures={root.get('failures')}, errors={root.get('errors')}\n")
                  for case in root.findall("testcase"):
                      for failure in list(case.findall("failure")) + list(case.findall("error")):
                          message = failure.get("message", "").splitlines()
                          summary.write(f"  - {case.get('name')}: {message[0] if message else failure.get('type', 'failure')}\n")
      - name: Android lint
        if: ${{ !cancelled() }}
        run: ./gradlew --no-daemon --stacktrace lintDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build_apks.outcome == 'success' }}
        with:
          name: life-widget-debug
          path: app/build/outputs/apk/debug/*.apk
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
